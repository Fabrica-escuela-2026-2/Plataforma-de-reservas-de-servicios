spring.application.name=service-platform
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Cargar variables del .env (forzando que lo lea como properties)
spring.config.import=optional:file:.env[.properties]

# Puerto (Render inyecta su propio PORT, local usa 8080)
server.port=${PORT:8080}

# Conexión a Base de Datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Inicialización de SQL
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Seguridad y JWT (con un valor por defecto local para que no falle al arrancar)
app.jwt.secret=${JWT_SECRET:k7gNU3sdo+OL0wNhqoVWhr3g6s1xYv72ol/pe/Unols0GJH9U2JGsUaI4Ax2Vx3b8R1qZ5mN6w==kjYt7Q3pL9xV2mB4nH8cF0dR6sT1uW5yA3eG7jK2oP4qZ8xV0bC6mN9rT3wE5iU7aS1dF4gH}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4321,http://localhost:5173}

# Logs
logging.level.org.springframework.security=DEBUG
logging.level.com.udea.service_platform=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation=DEBUG