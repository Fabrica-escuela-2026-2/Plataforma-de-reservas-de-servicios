services:
  - type: web
    name: service-platform-api
    env: docker
    plan: free
    region: ohio
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        # Orígenes permitidos por CORS (sin comodín). REEMPLAZAR por la URL real del frontend desplegado,

        value: https://frontend-service-platform.vercel.app,http://localhost:3000,http://localhost:5173
